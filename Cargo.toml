[package]
name = "rhasta"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.14", features = ["wayland"] }
bevy_egui = "0.28"
lib3mf = "0.1.6"
rfd = "0.7"
stl_io = "0.11.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

